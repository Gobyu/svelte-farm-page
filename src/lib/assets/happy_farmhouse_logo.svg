      <rect x="115" y="187" width="172" height="139" rx="5" fill="#CA7655"/>
      <path d="M103 205L201 121L298 205" fill="none" stroke="#704D3E" stroke-width="21" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M121 205L201 137L280 205" fill="#E4B77D"/>
      <path d="M121 205L201 137L280 205" fill="none" stroke="#B45B43" stroke-width="7" stroke-linejoin="round"/>
      <rect x="184" y="168" width="34" height="35" rx="17" fill="#FFF4DA"/>
      <path d="M200 170v31M185 185h32" stroke="#B45B43" stroke-width="4"/>
      <path d="M157 326v-76c0-25 19-44 44-44s44 19 44 44v76" fill="#F9E8C5"/>
      <path d="M164 326v-76c0-21 16-37 37-37s37 16 37 37v76" fill="#765745"/>
      <path d="M201 215v111" stroke="#F2CE9A" stroke-width="5"/>
      <path d="M170 252l25 25-25 26M232 252l-25 25 25 26" fill="none" stroke="#E6B685" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="193" cy="283" r="3.5" fill="#F2CE9A"/>
      <circle cx="209" cy="283" r="3.5" fill="#F2CE9A"/>
      <!-- Foreground field -->
      <path d="M-15 350C69 320 134 332 203 348C274 329 349 327 415 350V407H-15Z" fill="#527F64"/>
      <path d="M49 364c34-13 69-15 109-6M234 357c33-9 66-9 100 0" fill="none" stroke="#A5BD88" stroke-width="5" stroke-linecap="round"/>
