<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Happy Farmhouse logo</title>
  <desc id="description">A warm illustrated barn beneath a rising sun and rolling green fields beside the words Happy Farmhouse.</desc>
