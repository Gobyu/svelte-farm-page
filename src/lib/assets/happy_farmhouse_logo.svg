      <path d="M-10 270C48 220 103 226 159 256C224 196 281 209 410 248V403H-10Z" fill="#C2CC9A"/>
      <path d="M-18 310C72 269 123 288 191 319C265 259 333 272 417 307V405H-18Z" fill="#86A27B"/>
