  <!-- Brand wordmark -->
  <g fill="#385D49">
    <text x="443" y="203" font-family="Georgia, 'Times New Roman', serif" font-size="115" font-weight="bold" letter-spacing="-4">Happy</text>
  </g>
  <text x="451" y="278" fill="#B76C4B" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="50" font-weight="bold" letter-spacing="9">FARMHOUSE</text>
  <path d="M454 312h578" stroke="#D9C6A3" stroke-width="4" stroke-linecap="round"/>
  <path d="M454 330h180" stroke="#6C946D" stroke-width="7" stroke-linecap="round"/>
